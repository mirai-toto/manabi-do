sonar.projectKey=manabi-do
sonar.projectName=Manabi Do

# Flutter project lives in manabi_do/ subdirectory
sonar.projectBaseDir=manabi_do

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Exclude generated files and l10n output
sonar.exclusions=\
  **/*.g.dart,\
  **/l10n/app_localizations.dart,\
  **/l10n/app_localizations_*.dart,\
  **/widgetbook.directories.g.dart

sonar.coverage.exclusions=\
  **/*.g.dart,\
  **/l10n/**,\
  **/widgetbook/**

# Reports generated by flutter-reports service (paths relative to manabi_do/)
sonar.dart.analyzer.mode=MANUAL
sonar.dart.analyzer.report.path=analysis-results.txt
sonar.dart.analyzer.report.mode=LEGACY
sonar.flutter.tests.reportPath=manabi_do/tests.output
sonar.flutter.coverage.reportPath=coverage/lcov.info
