services:
  sonardb:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonardb_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    depends_on:
      - sonardb
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonardb:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - ./plugins:/opt/sonarqube/extensions/plugins
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  flutter-reports:
    build: ../../
    volumes:
      - ../../manabi_do:/app
      - pub-cache:/root/.pub-cache
    working_dir: /app
    command: >
      sh -c "flutter pub get &&
             flutter analyze > /app/analysis-results.txt 2>&1;
             flutter test --machine --coverage > /app/tests.output 2>/dev/null;
             exit 0"
    profiles:
      - scan

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli
    depends_on:
      sonarqube:
        condition: service_healthy
      flutter-reports:
        condition: service_completed_successfully
    volumes:
      - ../../:/usr/src
    working_dir: /usr/src
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    command: sonar-scanner -Dproject.settings=/usr/src/scripts/sonar/sonar-project.properties
    profiles:
      - scan

volumes:
  sonar_data:
  sonar_logs:
  sonardb_data:
  pub-cache:
