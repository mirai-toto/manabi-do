# The display name is load-bearing: semantic-release.yml triggers on
# workflows: ["ci"]. Renaming it here without updating that reference
# silently stops all releases.
name: ci

on:
  pull_request:
  # Scoped to main: an unscoped push trigger runs every job a second time on
  # branches that already have a pull request open, doubling CI for no signal.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: manabi_do

      - name: Analyze
        run: flutter analyze
        working-directory: manabi_do

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
        working-directory: manabi_do

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6

  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require updated Play release notes
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "No tag to compare against yet."
            exit 0
          fi

          # Commits semantic-release would turn into a new version. The (ci),
          # (build) and (deps) scopes are excluded: they never reach users.
          releasable=$(git log "$tag"..HEAD --format=%s \
            | grep -E '^(feat|fix|perf)(\([^)]*\))?!?:' \
            | grep -vE '^(feat|fix|perf)\((ci|build|deps)\)' \
            | wc -l)

          if [ "$releasable" -eq 0 ]; then
            echo "No user-facing changes since $tag; release notes not required."
            exit 0
          fi

          if git diff --quiet "$tag"..HEAD -- distribution/whatsnew/; then
            echo "::error::$releasable user-facing commit(s) since $tag, but distribution/whatsnew/ was not updated. Play would show the previous release's notes."
            exit 1
          fi

          echo "Release notes updated since $tag ($releasable user-facing commit(s))."

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github

      - name: Dry run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: semantic-release --dry-run
