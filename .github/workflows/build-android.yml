name: android release

# The file must stay at build-android.yml: versionCode comes from
# github.run_number, and that counter is tied to the workflow file path.
# Renaming the file resets it to 1, which Play refuses permanently.

on:
  release:
    types: [published]

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: manabi_do

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -d '\n' | base64 --decode > $HOME/release.jks

      - name: Verify keystore
        run: keytool -list -keystore $HOME/release.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -noprompt

      - name: Write key.properties
        run: |
          cat > manabi_do/android/key.properties << PROPS
          storeFile=$HOME/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Set version from release tag
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          BUILD=${{ github.run_number }}
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD}/" manabi_do/pubspec.yaml

      - name: Build AAB
        run: flutter build appbundle --release
        working-directory: manabi_do

      - name: Upload AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: manabi_do/build/app/outputs/bundle/release/app-release.aab
          token: ${{ secrets.RELEASE_PAT }}

      - name: Share AAB with the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: manabi_do/build/app/outputs/bundle/release/app-release.aab

  deploy-internal:
    name: Deploy to Play internal track
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab

      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.github.mirai_toto.manabi_do
          releaseFiles: app-release.aab
          tracks: internal
          whatsNewDirectory: distribution/whatsnew

  promote-production:
    name: Promote to Play production
    needs: deploy-internal
    # Required reviewers on the production environment pause this job until
    # approved in the run's "Review deployments" dialog. Reject to skip a
    # release; pending approvals expire after 30 days.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Promote internal release to production
        uses: kevin-david/promote-play-release@v1.2.0
        with:
          service-account-json-raw: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          package-name: com.github.mirai_toto.manabi_do
          from-track: internal
          to-track: production
          user-fraction: 1.0
