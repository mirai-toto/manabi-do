services:
  flutter:
    build: .
    volumes:
      - ./manabi_do:/app
      - pub-cache:/root/.pub-cache
      # Build output stays in volumes. Nothing the container compiles lands on
      # the host, so there are no root-owned files to clean up afterwards.
      - build-output:/app/build
      # The whole of .dart_tool, not just build/: the container's `pub get`
      # writes package_config.json with its own /root/.pub-cache paths, which
      # would break `flutter analyze` on the host if it reached the checkout.
      - dart-tool:/app/.dart_tool
      - linux-ephemeral:/app/linux/flutter/ephemeral
    working_dir: /app

  build:
    extends:
      service: flutter
    volumes:
      # `assets/` is a volume so the container's runtime copy never reaches the
      # host. The host's assets — fonts, icons, and the content DB that
      # scripts/content/fetch_content.sh downloaded — are seeded in read-only.
      # It clobbers: the host is the source of truth now, so a newly fetched
      # database must replace whatever an earlier run left in the volume.
      - ./manabi_do/assets:/seed-assets:ro
      - app-assets:/app/assets
    command: >
      sh -c "cp -r /seed-assets/. /app/assets/ &&
             flutter pub get && flutter gen-l10n &&
             dart run build_runner build --delete-conflicting-outputs 2>/dev/null;
             flutter build linux --release"

  # Same command CI runs, so a green local run means a green pipeline.
  test:
    extends:
      service: flutter
    command: >
      sh -c "flutter pub get && flutter test"

  # Runs the built app inside the container.
  #
  # Its database lives in the `app-data` volume, so the runtime copy is the
  # container's own — the host's ~/.local/share is never touched. The content DB
  # it reads comes from the host, seeded by the `build` service.
  app:
    extends:
      service: flutter
    environment:
      DISPLAY: ${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - app-data:/root/.local/share
      - app-assets:/app/assets
    command: ./build/linux/x64/release/bundle/manabi_do

volumes:
  pub-cache:
  app-assets:
  build-output:
  dart-tool:
  linux-ephemeral:
  app-data:
